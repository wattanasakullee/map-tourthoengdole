<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่แหล่งเรียนรู้อำเภอเทิง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=K2D:wght@500;700&family=Sarabun:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
<div class="wrap">
  <header class="hd">
    <div class="hd-title"><h1 class="page-title" id="mapTitle">แผนที่แหล่งเรียนรู้ อำเภอเทิง</h1></div>
    <p class="hd-tip"><span class="tip-ico" aria-hidden="true">👆</span><span id="subTitle">เลือกตำบลที่ต้องการชม</span></p>
  </header>

  <div class="msg" id="state">กำลังโหลดแผนที่…</div>

  <!-- หน้าแรก: เลือกตำบล -->
  <section id="home" hidden>
    <div class="tgrid" id="tgrid"></div>
  </section>

  <!-- หน้าแผนที่ของแต่ละตำบล -->
  <section id="mapView" hidden style="display:flex;flex-direction:column;gap:16px">
  <div class="tambonbox">
    <div class="tb-head">
      <span class="tb-label">📍 เลือกดูตำบลอื่น</span>
      <button type="button" id="homeBtn">← หน้าแรก (ทุกตำบล)</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="เลือกตำบล"></nav>
  </div>

  <div class="bar">
    <button type="button" id="voiceBtn">🔊 เสียงอ่าน: เปิด</button>
    <button type="button" id="stopBtn">⏹ หยุดเสียง</button>
    <button type="button" id="tourBtn">▶ เล่นทุกจุดตามลำดับ</button>
    <button type="button" id="setBtn" aria-expanded="false">⚙ ตั้งค่าเสียง</button>
  </div>
  <div class="voicebox" id="voiceBox" hidden></div>
  <p class="note" id="voiceNote"></p>

  <details class="introvid" id="introVid" hidden>
    <summary>🎬 ดูวิดีโอแนะนำตำบล</summary>
    <div id="introBody"></div>
  </details>
  <div class="msg" id="noImg" hidden>ตำบลนี้ยังไม่มีภาพแผนที่ ครูกำลังจัดทำ</div>
  <div class="stage" id="stage">
    <img class="map" id="mapImg" alt="" draggable="false">
  </div>
  <div id="cardSlot"></div>
  <div class="list" id="list" aria-label="รายชื่อสถานที่"></div>
  </section>

  <footer class="credit">
    สร้างสรรค์โดย <strong>ครู สกร.ระดับอำเภอเทิง</strong>
  </footer>
</div>

<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script type="module">
import { configured, watchMaps, imageSrc } from "./db.js";
let maps = [], cur = null, active = -1, version = null, touched = false, touring = false;
const stage = $("stage"), slot = $("cardSlot");

function fmtTime(ts) {
  const d = new Date(Number(ts)); if (isNaN(d)) return "";
  return d.toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
}
function renderTabs() {
  $("tabs").innerHTML = maps.map(m => `<button type="button" data-id="${esc(m.id)}" class="${cur && m.id === cur.id ? "on" : ""}" aria-pressed="${cur && m.id === cur.id}">${esc(m.name)}</button>`).join("");
}
/* หน้าแรก: การ์ดเลือกตำบล */
function showHome() {
  if (cur) { stopTour(); Voice.stop(); }
  cur = null; active = -1; placeCard(stage, slot, null, -1);
  $("mapView").hidden = true; $("state").hidden = !!maps.length; $("home").hidden = !maps.length;
  if (!maps.length) $("state").textContent = "ยังไม่มีแผนที่ ครูสามารถเพิ่มได้ที่หน้าแอดมิน";
  $("mapTitle").textContent = "แผนที่แหล่งเรียนรู้ อำเภอเทิง";
  $("subTitle").textContent = "เลือกตำบลที่ต้องการชม (" + maps.length + " ตำบล)";
  document.title = "แผนที่แหล่งเรียนรู้อำเภอเทิง";
  $("tgrid").innerHTML = maps.map(m => {
    const n = (m.places || []).length;
    return `<button type="button" class="tcard" data-id="${esc(m.id)}">
      <span class="thumb" data-id="${esc(m.id)}">${m.image ? "" : '<span class="ph">🗺<br>เร็ว ๆ นี้</span>'}</span>
      <span class="tname">${esc(m.name)}</span>
      <span class="tmeta">${n ? n + " แหล่งเรียนรู้" : "กำลังจัดทำ"}</span></button>`;
  }).join("");
  maps.forEach(m => {
    if (!m.image) return;
    const box = $("tgrid").querySelector(`.thumb[data-id="${CSS.escape(m.id)}"]`);
    const put = src => { if (!src || !box.isConnected) return; const im = new Image(); im.alt = ""; im.loading = "lazy"; setMapImage(im, src); box.replaceChildren(im); };
    if (m.thumb) put(m.thumb); else imageSrc(m).then(put);
  });
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && maps.find(m => m.id === id)) { if (!cur || cur.id !== id) selectMap(id); }
  else showHome();
}
function selectMap(id, keepCard) {
  const m = maps.find(x => x.id === id);
  if (!m) { showHome(); return; }
  const same = cur && cur.id === m.id;
  cur = m;
  renderTabs();
  $("state").hidden = true; $("home").hidden = true; $("mapView").hidden = false;
  stage.hidden = !cur.image; $("noImg").hidden = !!cur.image;
  $("subTitle").textContent = "ชี้เมาส์หรือแตะที่หมุดตัวเลข เพื่ออ่านและฟังข้อมูลแต่ละสถานที่";
  $("mapTitle").textContent = cur.title || cur.name;
  const iv = $("introVid");
  if (iv.dataset.url !== (cur.video || "")) { iv.dataset.url = cur.video || ""; iv.open = false; $("introBody").innerHTML = ""; }
  iv.hidden = !cur.video;
  document.title = cur.title || "แผนที่แหล่งเรียนรู้";
  const img = $("mapImg");
  img.alt = "ภาพแผนที่ " + (cur.name || "");
  const key = cur.id + ":" + cur.image + ":" + (cur.imageRev || 0);
  if (img.dataset.key !== key) { img.dataset.key = key; const want = cur; imageSrc(cur).then(src => { if (cur === want || (cur && cur.id === want.id)) setMapImage(img, src); }); }
  if (!same || !keepCard) { active = -1; stopTour(); Voice.stop(); }
  if (active >= cur.places.length) active = -1;
  renderPins(stage, cur.places, active);
  $("list").innerHTML = cur.places.map((p, i) => `<button type="button" data-i="${i}"><span class="n">${i + 1}</span>${esc(p.title)}</button>`).join("");
  if (active >= 0) showCard(active, false); else placeCard(stage, slot, null, -1);
  if (pendingScroll) { pendingScroll = false; scrollToMap(); }
}
function showCard(i, speak, scroll) {
  active = i;
  const p = cur && cur.places[i];
  placeCard(stage, slot, p, i, { onclose: () => active = -1, scroll: !!scroll });
  if (p && speak) return Voice.speak([p.title, p.text]);
  return Promise.resolve();
}

/* รับข้อมูลแบบเรียลไทม์จาก Firebase */
let first = true;
function onMaps(list, err) {
  if (!list) { if (first) { $("state").textContent = "โหลดแผนที่ไม่สำเร็จ: " + err; $("state").classList.add("err"); } return; }
  maps = list;
  if (first) route();
  else if (cur) { if (maps.find(m => m.id === cur.id)) selectMap(cur.id, true); else location.hash = "home"; }
  else showHome();
  if (!first) toast("แผนที่มีการอัปเดต");
  first = false;
}

/* เหตุการณ์ */
/* โหลดวิดีโอแนะนำเมื่อกดเปิดเท่านั้น หน้าเว็บจะได้ไม่ช้า */
$("introVid").addEventListener("toggle", () => { const iv = $("introVid"); if (iv.open && !$("introBody").innerHTML && cur) $("introBody").innerHTML = videoHTML(cur.video, "วิดีโอแนะนำ" + cur.name); });
/* เลือกตำบลแล้ว เลื่อนหน้าลงไปที่ภาพแผนที่ของตำบลนั้น */
let pendingScroll = false;
function goMap(id) {
  if (location.hash.slice(1) === id && cur && cur.id === id) scrollToMap();
  else { pendingScroll = true; location.hash = id; }
}
function scrollToMap() {
  const target = cur && cur.image ? stage : $("noImg");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  requestAnimationFrame(() => target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }));
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) goMap(b.dataset.id); });
$("tgrid").addEventListener("click", e => { const b = e.target.closest(".tcard"); if (b) goMap(b.dataset.id); });
$("homeBtn").onclick = () => { location.hash = "home"; };
stage.addEventListener("mouseover", e => {
  const pin = e.target.closest(".pin"); if (!pin || narrow() || touring) return;
  const i = +pin.dataset.i; if (i !== active) showCard(i, touched);
});
stage.addEventListener("click", e => {
  touched = true;
  const pin = e.target.closest(".pin"); if (!pin) return;
  stopTour(); showCard(+pin.dataset.i, true, true);
});
$("list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  touched = true; stopTour(); showCard(+b.dataset.i, true, true);
});

document.addEventListener("keydown", e => { if (e.key === "Escape") { Voice.stop(); stopTour(); active = -1; placeCard(stage, slot, null, -1); } });
window.addEventListener("hashchange", route);

function setVoiceBtn() { $("voiceBtn").textContent = "🔊 เสียงอ่าน: " + (Voice.on ? "เปิด" : "ปิด"); $("voiceBtn").classList.toggle("on", Voice.on); $("voiceBtn").setAttribute("aria-pressed", Voice.on); }
$("voiceBtn").onclick = () => { Voice.on = !Voice.on; store.set("tts_on", Voice.on); touched = true; if (!Voice.on) Voice.stop(); setVoiceBtn(); };
$("stopBtn").onclick = () => { stopTour(); Voice.stop(); };
$("setBtn").onclick = () => { const b = $("voiceBox"); b.hidden = !b.hidden; $("setBtn").setAttribute("aria-expanded", !b.hidden); };
mountVoiceBox($("voiceBox"), $("voiceNote"));
setVoiceBtn();

/* นำชมทุกจุด */
let tourRun = 0;
function stopTour() { touring = false; tourRun++; $("tourBtn").textContent = "▶ เล่นทุกจุดตามลำดับ"; }
$("tourBtn").onclick = async () => {
  touched = true;
  if (touring) { stopTour(); Voice.stop(); return; }
  if (!cur || !cur.places.length) return;
  touring = true; const run = ++tourRun; $("tourBtn").textContent = "⏸ หยุดเล่น";
  for (let i = 0; i < cur.places.length; i++) {
    if (run !== tourRun) return;
    const p = cur.places[i];
    if (Voice.on && Voice.synth && Voice.voices.length) await showCard(i, true, true);
    else { showCard(i, false, true); await new Promise(r => setTimeout(r, Math.max(3500, (p.text || "").length * 80))); }
    if (run !== tourRun) return;
    await new Promise(r => setTimeout(r, 800));
  }
  if (run === tourRun) stopTour();
};

if (!configured) {
  $("state").textContent = "ยังไม่ได้ตั้งค่าระบบ กรุณาใส่ค่า Firebase ในไฟล์ firebase-config.js";
  $("state").classList.add("err");
} else watchMaps(onMaps);
</script>
</body>
</html>
